name: android-apk
# APK Android installable, compile dans le cloud SANS compte Expo (prebuild + Gradle). Signature de debug : usage de test uniquement.
on:
  workflow_dispatch:
  push:
    tags: ["apk-*"]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependances
        run: npm install --no-audit --no-fund
        working-directory: app
      - name: Generer le projet Android
        run: npx expo prebuild --platform android --no-install
        working-directory: app
      - name: Compiler l'APK
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -q
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: apothecaria-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
