name: verify-sources
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # lundi : les sources EMA/PubMed peuvent changer
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Tests du verificateur
        run: python tests/test_verify.py
      - name: Verifier toutes les affirmations
        run: python tools/verify.py
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Le bundle de donnees est a jour
        run: |
          python tools/build_bundle.py
          git diff --exit-code app/src/data/bundle.json
      - name: Installer les dependances
        run: npm install --no-audit --no-fund
        working-directory: app
      - name: Verification des types
        run: npx tsc --noEmit --pretty false 2>&1 | sed 's/^/::error::/'
        working-directory: app
      - name: Tests du calculateur
        run: node --test src/tincture.test.ts src/safety.test.ts src/usages.test.ts src/infusion.test.ts src/library.test.ts src/armoire.test.ts
        working-directory: app
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tests du Worker (D1 simule)
        run: node --test server/src/worker.test.ts
